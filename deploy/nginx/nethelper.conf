# NetHelper: bare-metal nginx site (TLS). Serves the built SPA and proxies the
# API and WebSocket to the backend on 127.0.0.1:3000.
#
# Install (Debian/Ubuntu):
#   cp nethelper.conf /etc/nginx/sites-available/nethelper.conf
#   cp ../../frontend/nginx/security-headers.conf /etc/nginx/snippets/nethelper-security-headers.conf
#   ln -s ../sites-available/nethelper.conf /etc/nginx/sites-enabled/
#   Replace nethelper.example.com below, then get a certificate:
#     certbot certonly --webroot -w /var/www/letsencrypt -d nethelper.example.com
#   (or point ssl_certificate* at your internal CA's cert), then:
#   nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nethelper.example.com;

    # ACME HTTP-01 challenges for certbot's webroot mode.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on nginx 1.22+ (Debian 12, Ubuntu 24.04). On
    # 1.25.1+ (Debian 13) it logs a deprecation notice; switch to "http2 on;" there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nethelper.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/nethelper.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nethelper.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nethelper_ssl:10m;
    ssl_session_timeout 1d;

    root /opt/nethelper/frontend/dist;
    index index.html;

    # Matches the backend's default BODY_LIMIT.
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend probes: /health (liveness) and /health/ready (DB + Redis).
    # Without this the SPA fallback answered them with index.html and a 200.
    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        include /etc/nginx/snippets/nethelper-security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/nethelper-security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
