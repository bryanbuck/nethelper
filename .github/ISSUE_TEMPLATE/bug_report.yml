name: Bug report
description: Something in NetHelper doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove hostnames, addresses, serials and anything else you don't want to share, and **never paste backup contents or credentials**: device configs contain secrets. For a security problem, don't open an issue; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What you did and what happened
      description: Include the exact error text, or a screenshot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the page footer, or `GET /health`.
      placeholder: 0.9.0-beta.6
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and management plane
      placeholder: AOS-S 2930F, direct over SSH / Mist-managed EX4100
  - type: dropdown
    id: install
    attributes:
      label: Install
      options:
        - Docker Compose (install.sh)
        - Docker Compose (by hand)
        - Bare metal (systemd + nginx)
        - Development (npm run dev)
  - type: textarea
    id: logs
    attributes:
      label: Backend logs from around that time
      description: |
        Docker: `docker compose logs --since 30m backend`. Bare metal: `journalctl -u nethelper-backend --since "30 min ago"`. Logs mask secret-looking values, but skim them before posting.
      render: text
  - type: textarea
    id: test
    attributes:
      label: Test connection result
      description: For a device problem, the result of **Test connection** on the device's page.
